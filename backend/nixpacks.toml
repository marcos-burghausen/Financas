[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",
    "php82Extensions.pdo_mysql",
    "nodejs-18_x",
    "nginx",
    "python311Packages.supervisor"
]

[phases.build]
cmds = [
    # Configuração de diretórios
    "mkdir -p /var/log/nginx /run/php /app/storage/framework/{views,cache,sessions} /app/bootstrap/cache",
    "chown -R www-data:www-data /var/log /app/storage /app/bootstrap/cache",
    "chmod -R 775 /app/storage /app/bootstrap/cache",
    
    # Instalação de dependências
    "composer install --no-dev --optimize-autoloader",
    "npm install && npm run build"
]

[phases.postbuild]
cmds = [
    "php artisan optimize:clear",
    "php artisan config:cache",
    "php artisan route:cache"
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash

# Cria links simbólicos para arquivos do Nix
ln -sf /nix/store/*nginx*/conf/nginx.conf /etc/nginx.conf
ln -sf /nix/store/*nginx*/conf/mime.types /etc/mime.types

# Inicia serviços via supervisor
exec supervisord -n -c /etc/supervisord.conf
'''

"supervisord.conf" = '''
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:nginx]
command=nginx -c /etc/nginx.conf
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log

[program:php-fpm]
command=php-fpm -F -y /assets/php-fpm.conf
autorestart=true
stdout_logfile=/var/log/php-fpm.log
'''

"php-fpm.conf" = '''
[global]
error_log = /var/log/php-fpm.log

[www]
user = www-data
group = www-data
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
'''

"nginx.template.conf" = '''
user www-data;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include $!{nginx}/conf/mime.types;
    default_type application/octet-stream;
    
    server {
        listen ${PORT};
        server_name localhost;
        root /app/public;
        index index.php;

        # CORS
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include $!{nginx}/conf/fastcgi_params;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
'''