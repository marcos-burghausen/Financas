[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",  # Corrigido: mudado de Extensions para Packages
    "php82Extensions.curl",
    "php82Extensions.mbstring",
    "php82Extensions.xml",
    "php82Extensions.openssl",
    "php82Extensions.pdo_mysql",
    "mariadb",
    "python311Packages.supervisor",
    "nodejs-18_x",
    "nginx"  # Adicionado nginx explicitamente
]

[phases.build]
cmds = [
    "mkdir -p /var/log",
    "mkdir -p /app/storage/framework/{views,cache,sessions}",
    "mkdir -p /app/bootstrap/cache",
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "cp /assets/nginx.conf /etc/nginx/nginx.conf",  # Adicionado cópia do nginx.conf
    "chmod +x /assets/start.sh",
    "chown -R www-data:www-data /var/log /app/storage /app/bootstrap/cache",
    "composer install --no-dev --optimize-autoloader",
    "npm install && npm run production"
]

[phases.postbuild]
cmds = [
    "php artisan optimize:clear",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "/assets/start.sh"

[staticAssets]
"start.sh" = '''
#!/bin/bash
# Start services
/usr/bin/supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
silent=false

[program:php-fpm]
command=/usr/bin/php-fpm -F
autostart=true
autorestart=true

[program:nginx]
command=/usr/bin/nginx -g "daemon off;"
autostart=true
autorestart=true

[program:laravel-worker]
command=/usr/bin/php /app/artisan queue:work
autostart=true
autorestart=true
'''

"nginx.conf" = '''
user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        root /app/public;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
'''