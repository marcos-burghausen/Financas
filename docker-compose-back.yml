version: '3.9'

services:

  backend:
    image: marcosrafaelburghausen/php8.3-apache2.4
    container_name: financas-backend
    working_dir: /var/www/html
    depends_on:
      - mysql
      - redis
    ports:
      - "4080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: user
      MYSQL_USER: user
      MYSQL_DATABASE: Mr_database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: senha
    networks:
      - coolify-network

  mysql:
    image: mysql:8.0
    container_name: financas-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: user
      MYSQL_USER: user
      MYSQL_DATABASE: Mr_database
    networks:
      - coolify-network

  redis:
    image: redis:7.0
    container_name: financas-redis
    command: redis-server --requirepass senha
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coolify-network

volumes:
  mysql_data:
  redis_data:

networks:
  coolify-network:
    driver: bridge