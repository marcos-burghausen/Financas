version: '3.9'

services:
  frontend:
    image: node:18
    container_name: financas-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${BACKEND_URL:-http://localhost:4080/api}
      NODE_ENV: production
    command: >
      sh -c "npm install && 
      npm run build && 
      npm install -g http-server && 
      http-server dist -p 3000 --host 0.0.0.0"
    restart: unless-stopped
    networks:
      - coolify-network

  backend:
    image: marcosrafaelburghausen/php8.3-apache2.4
    container_name: financas-backend
    working_dir: /var/www/html
    depends_on:
      - mysql
      - redis
    ports:
      - "4080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: user
      MYSQL_USER: user
      MYSQL_DATABASE: Mr_database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: senha
    networks:
      - coolify-network

  mysql:
    image: mysql:8.0
    container_name: financas-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: user
      MYSQL_USER: user
      MYSQL_DATABASE: Mr_database
    networks:
      - coolify-network

  redis:
    image: redis:7.0
    container_name: financas-redis
    command: redis-server --requirepass senha
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coolify-network

volumes:
  mysql_data:
  redis_data:

networks:
  coolify-network:
    driver: bridge