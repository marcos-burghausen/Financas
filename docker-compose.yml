version: '3.9'

services:
  #php+apache
  php:
    image: marcosrafaelburghausen/php8.3-apache2.4
    container_name: Mr_backend
    working_dir: /var/www/html/
    networks:
      - network
    ports:
      - "4090:80"
    volumes:
      - "./backend:/var/www/html"
    environment:
      FRONTEND_HOST: node:4081
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  #node
  node:
    image: marcosrafaelburghausen/node-19
    container_name: Mr_frontend
    working_dir: /home/node/app
    stdin_open: true
    tty: true
    command: bash -c "npm i && npm run dev -- --host"
    networks:
      - network
    ports:
      - "4081:5173"
    volumes:
      - "./frontend:/home/node/app"
    environment:
      BACK_HOST: php:4081/api
      CHOKIDAR_USEPOLLING: 'true'

networks:
  network:
    driver: bridge
